  <body>
    <!--
      THESIS: A recruiter's-scan portfolio staged as a measured drawing, not a
      polished brochure: paper-and-ink neutrals with fine grid hairlines,
      registration marks and coordinate ticks, refusing the near-black/neon
      or cream/serif-hero defaults this category converges on.
      OWN-WORLD: Warm paper (#F6F4EE) / warm ink (#201D18), one accent (the
      existing logo yellow, #F2A900) spent only on the CTA, index numbers,
      stat values and focus rings, never on headline text. Fraunces italic
      for the name/project-title display moments, Public Sans for body,
      IBM Plex Mono for every eyebrow, index and annotation label. Hairline
      dashed rules, corner "+" marks and ruler ticks extend the app's
      existing diagonal-hatch <Scales> dividers instead of replacing them.
      STORY: A recruiter lands, reads a quiet italic name (not a shouting
      yellow headline), gets one yellow CTA, and scans indexed project tiles
      with quantified outcomes before the visual system ever competes with
      the pitch.
      FIRST VIEWPORT: Centered masthead hero on a faint edge-to-edge grid,
      corner marks pinned to the frame, mono eyebrow above an italic serif
      greeting, muted tagline, one yellow pill CTA + outline CV download,
      closed by a full-bleed dashed-rule coordinate strip.
      FORM: User-pinned direction ("Papel & Grade" / option 1 of 5, approved
      against a mocked home/projects/detail comparison outside this tool);
      concept-seed and the decision page were skipped per "the brief wins"
      and "a user- or brief-pinned direction beats the roll, always".
      FINISH: unreviewed and undocumented is unfinished; this build ends
      with the finish review, the verdict, DESIGN.md, and every shipping
      raster carrying its provenance.
    -->
